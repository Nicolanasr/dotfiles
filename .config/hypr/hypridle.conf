general {
    # Lock command using Noctalia's native session lock (matches your Super+Ctrl+L bind)
    lock_cmd = pidof hyprlock || noctalia msg session lock
    # Run before sleep/suspend
    before_sleep_cmd = loginctl lock-session
    # Wake displays on user activity
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 1. Dim screen after 2.5 minutes (150s)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 2. Lock session after 5 minutes (300s)
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 3. Turn off screen (DPMS off) after 5.5 minutes (330s)
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 4. Suspend to RAM after 30 minutes of complete inactivity (1800s)
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
EOF
